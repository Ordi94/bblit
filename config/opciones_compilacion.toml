# Opciones de compilacion por archivo C (clave: nombre del archivo sin src/ ni .c).
#
# g: umbral de datos pequenos (-G) del compilador. Por omision 0. Un archivo cuyo original
# accede a variables con desplazamiento($gp) se compilo con datos pequenos; con un valor mayor
# que cero las variables externas pequenas se emiten en forma simbolica (sh $2,D_80069662),
# como en el original, en lugar de lui mas desplazamiento. build, diff y probar leen este archivo.
# Los archivos que no figuran compilan con -G0.

[archivos.camara_y_bucle_logico]
g = 8

[archivos.arranque_y_bucle_principal_2]
g = 8

[archivos.tarjeta_de_memoria]
g = 8

[archivos.entrada_de_mando]
g = 8

[archivos.graficos_y_gte]
g = 8

[archivos.graficos_y_gte_10]
g = 8

[archivos.graficos_y_gte_12]
g = 8

[archivos.interprete_de_eventos]
g = 8

[archivos.cargador_de_niveles_y_cd]
g = 8

[archivos.inicializacion_de_motor]
g = 8

[archivos.movimiento_y_objetos_de_escena_2]
g = 8

[archivos.gestion_y_dibujo_de_objetos]
g = 8

[archivos.gestion_y_dibujo_de_objetos_2]
g = 8

[archivos.gestion_y_dibujo_de_objetos_3]
g = 8

[archivos.gestion_y_dibujo_de_objetos_4]
g = 8

[archivos.menus_e_interfaz]
g = 8

# Enlace. gp: valor de $gp que fija el codigo de arranque del juego (lui gp,0x8007 ;
# addiu gp,gp,-0x6CE0). build lo define como _gp en el enlace; las referencias relativas a $gp
# de los objetos C se resuelven contra el. Es un simbolo absoluto: no cambia ningun byte.
[enlace]
gp = 0x80069320

# Datos pequenos que el codigo direcciona con desplazamiento($gp): simbolo = direccion. Un archivo C
# que los usa los declara como definicion tentativa (sin extern) y maspsx los reescribe a $gp; el
# enlace les da esta direccion (los fija junto a _gp). Se retiran cuando config/symbols.txt los declare.
[datos_pequenos]
D_80069330 = 0x80069330

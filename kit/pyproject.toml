[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "psx-decomp-kit"
version = "0.1.0"
description = "Herramientas de descompilacion matching para juegos de PlayStation 1"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jairo Ornelas" }]
keywords = ["playstation", "ps1", "decompilation", "matching", "splat", "gcc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Disassemblers",
    "Typing :: Typed",
]
dependencies = ["requests>=2.32", "PyYAML>=6.0"]

[project.urls]
Repository = "https://github.com/Ordi94/psx-decomp-kit"
Issues = "https://github.com/Ordi94/psx-decomp-kit/issues"
Changelog = "https://github.com/Ordi94/psx-decomp-kit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
particion = ["splat64[mips]>=0.50"]
comparacion = [
    "rapidfuzz>=3.14",
    "Levenshtein>=0.27",
    "cxxfilt>=0.3",
    "colorama>=0.4",
    "watchdog>=6.0",
]
desarrollo = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "mypy==2.4.0",
    "ruff==0.17.2",
    "types-requests==2.33.0.20261006",
    "types-PyYAML==6.0.12.20260906",
]

[tool.setuptools.packages.find]
include = ["psxdecomp*"]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["psxdecomp", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "D", "ANN", "S", "PL", "RUF"]
ignore = ["D203", "D212", "D213", "PLR0913", "PLR2004", "S603", "S607"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN", "PLR"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["psxdecomp", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-rs --cov=psxdecomp --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["psxdecomp"]

[tool.setuptools.package-data]
psxdecomp = ["py.typed"]

[project]
name = "bblit"
version = "0.1.0"
description = "Descompilacion de Bugs Bunny: Lost in Time (PlayStation, SLUS-00838) a C"
requires-python = ">=3.13"

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["tools", "tests", "kit", "kit/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "D", "ANN", "S", "PL", "RUF"]
ignore = ["D203", "D212", "D213", "PLR0913", "PLR2004", "S603", "S607"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN", "PLR"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["tools", "tests", "kit/psxdecomp", "kit/tests"]
mypy_path = ["kit", "kit/tests"]

# Las pruebas del proyecto se tipan con strict salvo la exigencia de anotar cada funcion y de
# no llamar a funciones sin anotar. Deuda a cerrar: quedan 163 funciones de tests/ sin anotar
# (13 archivos); al anotarlas se elimina este bloque.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests", "kit/tests"]
pythonpath = [".", "kit", "kit/tests"]
addopts = "-q"

# Manifiesto del proyecto para psx-decomp-kit (contrato: kit/README.md).
# Los valores reflejan las constantes vigentes de tools/; la prueba de coherencia del kit
# (kit/tests/test_coherencia_consumidor.py) falla si alguno se desvia.

[proyecto]
nombre = "bblit"
ejecutable = "SLUS_008.38"
referencia = "config/ejecutable.json"
prefijo_entorno = "BBLIT"
comando = "python tools/build.py"
funcion_ejemplo = "func_80036204"

[rutas]
fuentes = "src"
incluir = "include"
asm = "asm"
macros = "asm/include"
# Ensamblador original por funcion: las cerradas en C y las que siguen pendientes.
asm_coincidente = "asm/matchings"
asm_pendiente = "asm/nonmatchings"
build = "build"
expected = "expected"
splat = "config/splat.yaml"
simbolos = ["config/symbols.txt"]
simbolos_adicionales = "config/simbolos_adicionales.txt"
opciones_compilacion = "config/opciones_compilacion.toml"
toolchain_lock = "config/toolchain.lock.json"
local = "config/local.toml"
documento_progreso = "docs/PROGRESO.md"
readme = "README.md"
# Carpetas de asm/ y expected/ que pertenecen a otras herramientas: split y clean no las tocan.
subcarpetas_ajenas = ["overlay"]
# Carpetas de asm/ que el medidor de progreso no cuenta como codigo propio (ademas de las ajenas).
asm_auxiliares = ["include", "matchings"]

[zonas]
juego_desde = 0x80014AC4
librerias_desde = 0x80045DA0
librerias_hasta = 0x8005DEA0

[convenciones]
macro_no_coincidente = "NON_MATCHING"
macro_ensamblador = "INCLUDE_ASM"
pendiente = '\APendiente:\s*puntuacion\s+(\d+)\b'
sufijo_subsistema = '_\d+$'
manuscrita = '\brutina(?:\s+de\s+\w+)?\s+escrita\s+a\s+mano\s+en\s+el\s+original\b'
patron_simbolo_datos = '^D_([0-9A-F]{8})$'
patron_linea_simbolo = '^([A-Za-z_]\w*)\s*=\s*0x([0-9A-Fa-f]{1,8})\s*;\s*//(.*)$'
max_valor_g = 64

# Cadena de compilacion: version del ensamblador original que imita maspsx (determinada
# comparando la salida con funciones reales; ver docs/COMPILADOR.md) y opciones del compilador.
[compilacion]
version_aspsx = "2.80"
opciones_compilador = ["-quiet", "-O2"]

# Extensiones del juego: los subcomandos de overlay y bzz se anadiran cuando consuman el manifiesto.
# `progreso` es una orden del kit; su agrupado por subsistema usa convenciones.sufijo_subsistema.
[plugins]
subcomandos = []
antes_de_construir = []
despues_de_verificar = []
